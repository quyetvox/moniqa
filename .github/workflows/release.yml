name: macOS Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match app version v$APP_VERSION" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles dmg

      - name: Prepare release asset
        env:
          REF_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/$TARGET/release/bundle/dmg"
          dmg_path="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "No DMG found in $bundle_dir" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$dmg_path" "release-assets/MoniQA-${REF_NAME}-macos-${ARCH}.dmg"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: MoniQA-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS builds
        uses: actions/download-artifact@v4
        with:
          pattern: MoniQA-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MoniQA ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.dmg
